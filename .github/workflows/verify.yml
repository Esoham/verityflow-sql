name: Verify portfolio
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute SQL reporting
        run: python run.py
      - name: Generate dashboard
        run: python dashboard.py
      - name: Generate synthetic records
        run: python generate_demo.py
      - name: Check generated artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          assert Path('dashboard.html').exists()
          with Path('data/generated_applications.csv', newline='') as f:
              assert sum(1 for _ in csv.DictReader(f)) == 2000
          print('VerityFlow smoke checks passed')
          PY
